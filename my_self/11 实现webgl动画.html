<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webgl</title>
  <style>
    .canvas {
      border: 1px solid red;
    }
  </style>
</head>
<body>
  <!--
    attribute: 用于顶点着色器，定义从顶点缓冲区传入的变量（仅在顶点着色器中使用）
    uniform: 定义在整个渲染过程中保持不变的变量，常用于传递变换矩阵、光照参数等
    varying: 用于在顶点着色器和片元着色器之间传递 插值 数据
  -->
  <canvas class="canvas" width="500" height="500"></canvas>
  <!-- 顶点着色器 -->
  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 aPosition;
    uniform mat4 u_x_matrix;
    uniform mat4 u_y_matrix;
    void main() {
      gl_Position = u_x_matrix * u_y_matrix * aPosition;
      gl_PointSize = 10.0;
    }
  </script>
  <!-- 片段着色器 -->
  <script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    uniform vec4 uColor;
    void main() {
      gl_FragColor = uColor;
    }
  </script>
  <script type="module">
    /*
      requestAnimationFrame(callback)   每秒钟60次
    */
    import initshader from './initshader.js'

    const canvas = document.querySelector('.canvas');
    const gl = canvas.getContext('webgl');
    if (!gl) {
      console.error('WebGL not supported');
    }
    const program = initshader(gl);
    

    const vertices = new Float32Array([
      // 前面
      -0.5, -0.5, 0.5,
      0.5, -0.5, 0.5,
      0.5, 0.5, 0.5,
      -0.5, 0.5, 0.5,
      // 后面
      -0.5, -0.5, -0.5,
      -0.5, 0.5, -0.5,
      0.5, 0.5, -0.5,
      0.5, -0.5, -0.5,
      // 上面
      -0.5, 0.5, -0.5,
      -0.5, 0.5, 0.5,
      0.5, 0.5, 0.5,
      0.5, 0.5, -0.5,
      // 下面
      -0.5, -0.5, -0.5,
      0.5, -0.5, -0.5,
      0.5, -0.5, 0.5,
      -0.5, -0.5, 0.5,
      // 右面
      0.5, -0.5, -0.5,
      0.5, 0.5, -0.5,
      0.5, 0.5, 0.5,
      0.5, -0.5, 0.5,
      // 左面
      -0.5, -0.5, -0.5,
      -0.5, -0.5, 0.5,
      -0.5, 0.5, 0.5,
      -0.5, 0.5, -0.5,
    ])

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

    const indices = new Uint16Array([
      0, 1, 2, 0, 2, 3,
      4, 5, 6, 4, 6, 7,
      8, 9, 10, 8, 10, 11,
      12, 13, 14, 12, 14, 15,
      16, 17, 18, 16, 18, 19,
      20, 21, 22, 20, 22, 23
    ]);
    const indexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

    const posLocation = gl.getAttribLocation(program, 'aPosition');
    gl.vertexAttribPointer(posLocation, 3, gl.FLOAT, false, 3 * Float32Array.BYTES_PER_ELEMENT, 0);
    gl.enableVertexAttribArray(posLocation);

    // gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);

    const faceColors = [
      [1.0, 0.0, 0.0, 1.0],   // 前面
      [1.0, 1.0, 0.0, 1.0],   // 后面
      [1.0, 0.0, 1.0, 1.0],   // 上面
      [0.0, 1.0, 0.0, 1.0],   // 下面
      [0.0, 0.0, 1.0, 1.0],   // 右面
      [0.0, 1.0, 1.0, 1.0],   // 左面
    ];

    const colorLocation = gl.getUniformLocation(program, 'uColor');
    gl.enable(gl.DEPTH_TEST);
    const u_x_matrix = gl.getUniformLocation(program, 'u_x_matrix');
    const u_y_matrix = gl.getUniformLocation(program, 'u_y_matrix');
    let deg = 30;

    function render() {
      deg += 0.1;
      const cosB = Math.cos(deg * Math.PI / 180);
      const sinB = Math.sin(deg * Math.PI / 180);
      gl.uniformMatrix4fv(u_x_matrix, false, new Float32Array([
        1,0,0,0,
        0,cosB,-sinB,0,
        0,sinB,cosB,0,
        0,0,0,1
      ]));
      gl.uniformMatrix4fv(u_y_matrix, false, new Float32Array([
        cosB,0,-sinB,0,
        0,1,0,0,
        sinB,0,cosB,0,
        0,0,0,1
      ]));
      for (let i = 0; i < 6; i++) {
        gl.uniform4fv(colorLocation, faceColors[i]);
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, i * 6 * Uint16Array.BYTES_PER_ELEMENT);
      }
      window.requestAnimationFrame(render);
    }
    window.requestAnimationFrame(render);

  </script>
</body>
</html>
