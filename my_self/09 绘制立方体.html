<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webgl</title>
  <style>
    .canvas {
      border: 1px solid red;
    }
  </style>
</head>
<body>
  <!--
    attribute: 用于顶点着色器，定义从顶点缓冲区传入的变量（仅在顶点着色器中使用）
    uniform: 定义在整个渲染过程中保持不变的变量，常用于传递变换矩阵、光照参数等
    varying: 用于在顶点着色器和片元着色器之间传递 插值 数据
  -->
  <canvas class="canvas" width="500" height="500"></canvas>
  <!-- 顶点着色器 -->
  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 aPosition;
    void main() {
      float radian = radians(45.0);
      float sin = sin(radian);
      float cos = cos(radian);
      mat4 mx = mat4(
        1, 0, 0, 0,
        0, cos, -sin, 0,
        0, sin, cos, 0,
        0, 0, 0, 1
      );
      mat4 my = mat4(
        cos, 0, -sin, 0,
        0, 1, 0, 0,
        sin, 0, cos, 0,
        0, 0, 0, 1
      );
      gl_Position = mx * my * aPosition;
      gl_PointSize = 10.0;
    }
  </script>
  <!-- 片段着色器 -->
  <script id="fragment-shader" type="x-shader/x-fragment">
    precision highp float;
    void main() {
      gl_FragColor = vec4(1.0, 1.0, 0.0, 1.0);
    }
  </script>
  <script type="module">
    import initshader from './initshader.js'
    function initShader(gl) {
      // 创建顶点着色器和片元着色器
      const vertexShader = gl.createShader(gl.VERTEX_SHADER);
      const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
      // 获取着色器源码
      const vertextSource = document.getElementById('vertex-shader').textContent;
      const fragmentSource = document.getElementById('fragment-shader').textContent;
      // 绑定着色器源码
      gl.shaderSource(vertexShader, vertextSource);
      gl.shaderSource(fragmentShader, fragmentSource);
      // 编译着色器源码
      gl.compileShader(vertexShader);
      gl.compileShader(fragmentShader);
      // 检查着色器编译结果（出错时控制台会有提示）
      [['vertex', vertexShader], ['fragment', fragmentShader]].forEach(([name, shader]) => {
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error(name, 'shader compile error:', gl.getShaderInfoLog(shader));
        }
      });
      // 创建程序对象
      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      // 链接program
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('program link error:', gl.getProgramInfoLog(program));
      }
      gl.useProgram(program);

      return program
    }

    const canvas = document.querySelector('.canvas');
    const gl = canvas.getContext('webgl');
    if (!gl) {
      console.error('WebGL not supported');
    }
    const program = initshader(gl);
    

    const vertices = new Float32Array([
      0.5, 0.5, 0.5,
      -0.5, 0.5, 0.5,
      -0.5, -0.5, 0.5,
      0.5, -0.5, 0.5,

      0.5, 0.5, -0.5,
      -0.5, 0.5, -0.5,
      -0.5, -0.5, -0.5,
      0.5, -0.5, -0.5,

      0.5, 0.5, 0.5,
      0.5, 0.5, -0.5,

      -0.5, 0.5, 0.5,
      -0.5, 0.5, -0.5,

      -0.5, -0.5, 0.5,
      -0.5, -0.5, -0.5,

      0.5, -0.5, 0.5,
      0.5, -0.5, -0.5,
    ])

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW)

    const posLocation = gl.getAttribLocation(program, 'aPosition');
    gl.vertexAttribPointer(posLocation, 3, gl.FLOAT, false, 3 * Float32Array.BYTES_PER_ELEMENT, 0);
    gl.enableVertexAttribArray(posLocation);

  


    gl.drawArrays(gl.POINTS, 0, 4);
    gl.drawArrays(gl.LINE_LOOP, 0, 4);
    gl.drawArrays(gl.POINTS, 4, 4);
    gl.drawArrays(gl.LINE_LOOP, 4, 4);
    gl.drawArrays(gl.LINES, 8, 8);
  </script>
</body>
</html>
