<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webgl</title>
  <style>
    .canvas {
      border: 1px solid red;
    }
  </style>
</head>
<body>
  <!--
    attribute: 用于顶点着色器，定义从顶点缓冲区传入的变量（仅在顶点着色器中使用）
    uniform: 定义在整个渲染过程中保持不变的变量，常用于传递变换矩阵、光照参数等
    varying: 用于在顶点着色器和片元着色器之间传递 插值 数据
  -->
  <canvas class="canvas" width="500" height="500"></canvas>
  <!-- 顶点着色器 -->
  <script id="vertex-shader" type="x-shader/x-vertex">
    /*
    预编译指令
    GL_ES: 如果在opgl es环境中运行则GL_ES被设置成1，一般用来检查当前环境是不是OPENGL_ES
    GL_FRAGMENT_PRECISION_HIGH: 如果当前系统glsl的片元着色器支持高浮点精度，则设置为1，一般用于检查着色器精度
    */
    #ifdef GL_ES
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    #endif
    attribute vec4 aPosition;
    void main() {
      float radian = radians(10.0);
      float sin = sin(radian);
      float cos = cos(radian);
      mat4 mx = mat4(
        1, 0, 0, 0,
        0, cos, -sin, 0,
        0, sin, cos, 0,
        0, 0, 0, 1
      );
      mat4 my = mat4(
        cos, 0, -sin, 0,
        0, 1, 0, 0,
        sin, 0, cos, 0,
        0, 0, 0, 1
      );
      gl_Position = mx * my * aPosition;
      gl_PointSize = 10.0;
    }
  </script>
  <!-- 片段着色器 -->
  <script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    uniform vec4 uColor;
    void main() {
      gl_FragColor = uColor;
    }
  </script>
  <script type="module">
    // import initshader from './initshader.js'
    function initShader(gl) {
      // 创建顶点着色器和片元着色器
      const vertexShader = gl.createShader(gl.VERTEX_SHADER);
      const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
      // 获取着色器源码
      const vertextSource = document.getElementById('vertex-shader').textContent;
      const fragmentSource = document.getElementById('fragment-shader').textContent;
      // 绑定着色器源码
      gl.shaderSource(vertexShader, vertextSource);
      gl.shaderSource(fragmentShader, fragmentSource);
      // 编译着色器源码
      gl.compileShader(vertexShader);
      gl.compileShader(fragmentShader);
      // 检查着色器编译结果（出错时控制台会有提示）
      [['vertex', vertexShader], ['fragment', fragmentShader]].forEach(([name, shader]) => {
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error(name, 'shader compile error:', gl.getShaderInfoLog(shader));
        }
      });
      // 创建程序对象
      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      // 链接program
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('program link error:', gl.getProgramInfoLog(program));
      }
      gl.useProgram(program);

      return program
    }

    const canvas = document.querySelector('.canvas');
    const gl = canvas.getContext('webgl');
    if (!gl) {
      console.error('WebGL not supported');
    }
    const program = initShader(gl);
    

    const vertices = new Float32Array([
      // 前面
      -0.5, -0.5, 0.5,
      0.5, -0.5, 0.5,
      0.5, 0.5, 0.5,
      -0.5, 0.5, 0.5,
      // 后面
      -0.5, -0.5, -0.5,
      -0.5, 0.5, -0.5,
      0.5, 0.5, -0.5,
      0.5, -0.5, -0.5,
      // 上面
      -0.5, 0.5, -0.5,
      -0.5, 0.5, 0.5,
      0.5, 0.5, 0.5,
      0.5, 0.5, -0.5,
      // 下面
      -0.5, -0.5, -0.5,
      0.5, -0.5, -0.5,
      0.5, -0.5, 0.5,
      -0.5, -0.5, 0.5,
      // 右面
      0.5, -0.5, -0.5,
      0.5, 0.5, -0.5,
      0.5, 0.5, 0.5,
      0.5, -0.5, 0.5,
      // 左面
      -0.5, -0.5, -0.5,
      -0.5, -0.5, 0.5,
      -0.5, 0.5, 0.5,
      -0.5, 0.5, -0.5,
    ])

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

    const indices = new Uint16Array([
      0, 1, 2, 0, 2, 3,
      4, 5, 6, 4, 6, 7,
      8, 9, 10, 8, 10, 11,
      12, 13, 14, 12, 14, 15,
      16, 17, 18, 16, 18, 19,
      20, 21, 22, 20, 22, 23
    ]);
    const indexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

    const posLocation = gl.getAttribLocation(program, 'aPosition');
    gl.vertexAttribPointer(posLocation, 3, gl.FLOAT, false, 3 * Float32Array.BYTES_PER_ELEMENT, 0);
    gl.enableVertexAttribArray(posLocation);

    // gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);

    const faceColors = [
      [1.0, 0.0, 0.0, 1.0],   // 前面
      [1.0, 1.0, 0.0, 1.0],   // 后面
      [1.0, 0.0, 1.0, 1.0],   // 上面
      [0.0, 1.0, 0.0, 1.0],   // 下面
      [0.0, 0.0, 1.0, 1.0],   // 右面
      [0.0, 1.0, 1.0, 1.0],   // 左面
    ];

    const colorLocation = gl.getUniformLocation(program, 'uColor');
    for (let i = 0; i < 6; i++) {
      gl.uniform4fv(colorLocation, faceColors[i]);
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, i * 6 * Uint16Array.BYTES_PER_ELEMENT);
    }

  </script>
</body>
</html>
